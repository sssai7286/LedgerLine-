version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: ledgerline_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ledgerline

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledgerline_server
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017/ledgerline
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:3000

  client:
    image: node:20-alpine
    container_name: ledgerline_client
    working_dir: /app
    volumes:
      - ./client:/app
    ports:
      - '3000:3000'
    command: sh -c "npm install && npm start"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - server

volumes:
  mongo_data:
