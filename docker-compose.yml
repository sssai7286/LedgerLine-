services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgerline}
      POSTGRES_USER: ${POSTGRES_USER:-ledgerline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerline}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ledgerline}:${POSTGRES_PASSWORD:-ledgerline}@db:5432/${POSTGRES_DB:-ledgerline}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:5000

volumes:
  postgres_data:
